name: andespace
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  geolocator: ^13.0.0
  dio: ^5.7.0
  flutter_svg: ^2.0.10
  light_sensor: ^3.0.2
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.5.1
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.1
  shared_preferences: ^2.3.2
  path_provider: ^2.1.5
  path: ^1.9.0

  file_picker: ^8.0.0
  uuid: ^4.5.3
  drift: ^2.20.0
  drift_flutter: ^0.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.7
  drift_dev: ^2.20.0
  build_runner: ^2.4.13

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/Logo.png"

flutter_native_splash:
  android: true
  ios: false
  web: false
  color: "#FFFFFF"
  image: assets/icons/LogoCompleto.png

  android_12:
    color: "#FFFFFF"
    image: assets/icons/LogoCompleto.png

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/fonts/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600

    - family: ADLaMDisplay
      fonts:
        - asset: assets/fonts/ADLaMDisplay-Regular.ttf
          weight: 400
